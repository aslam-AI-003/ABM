<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Arabian Bismi Mandi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/ABM_logo.jpg" alt="Arabian Bismi Mandi Logo" class="logo-img">
            <h1>Arabian Bismi Mandi</h1>
        </div>
        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Order</a>
            <a href="admin.html"><i class="fas fa-cog"></i> Menu</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Sales</a>
            <a href="expenses.html" class="active"><i class="fas fa-wallet"></i> Expenses</a>
        </nav>
    </header>

    <main class="admin-main">
        <section class="admin-section">
            <div class="admin-header">
                <h2><i class="fas fa-wallet"></i> Daily Expenses</h2>
                <button class="add-item-btn" id="addExpenseBtn">
                    <i class="fas fa-plus"></i> Add Expense
                </button>
            </div>

            <!-- Date Filter -->
            <div class="expense-filters">
                <div class="expense-date-filter">
                    <label for="expenseDateFilter"><i class="fas fa-calendar"></i> Date:</label>
                    <input type="date" id="expenseDateFilter">
                </div>
                <div class="expense-summary">
                    <div class="expense-total-card">
                        <i class="fas fa-rupee-sign"></i>
                        <span>Today's Total: <strong id="expenseTotal">₹0</strong></span>
                    </div>
                </div>
            </div>

            <div class="menu-table-container">
                <table class="menu-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount (₹)</th>
                            <th>Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                        <!-- Expenses will be loaded here -->
                    </tbody>
                </table>
                <p class="no-data" id="noExpenseMessage" style="display: none;">
                    <i class="fas fa-info-circle"></i> No expenses recorded for this date
                </p>
            </div>
        </section>
    </main>

    <!-- Add/Edit Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content modal-form">
            <span class="close-modal" id="closeExpenseModal">&times;</span>
            <h2 id="expenseModalTitle"><i class="fas fa-plus-circle"></i> Add Expense</h2>
            <form id="expenseForm">
                <input type="hidden" id="expenseId">
                <div class="form-group">
                    <label for="expenseCategory"><i class="fas fa-list"></i> Category</label>
                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Groceries">Groceries / Raw Materials</option>
                        <option value="Meat">Meat & Chicken</option>
                        <option value="Gas">Gas / Fuel</option>
                        <option value="Salary">Salary / Wages</option>
                        <option value="Rent">Rent</option>
                        <option value="Electricity">Electricity Bill</option>
                        <option value="Transport">Transport</option>
                        <option value="Maintenance">Maintenance / Repair</option>
                        <option value="Packaging">Packaging</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expenseDescription"><i class="fas fa-pen"></i> Description</label>
                    <input type="text" id="expenseDescription" required placeholder="e.g., Bought chicken 10kg">
                </div>
                <div class="form-group">
                    <label for="expenseAmount"><i class="fas fa-rupee-sign"></i> Amount</label>
                    <input type="number" id="expenseAmount" required placeholder="e.g., 5000" min="1">
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelExpenseBtn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="save-btn">
                        <i class="fas fa-save"></i> Save Expense
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteExpenseModal">
        <div class="modal-content modal-confirm">
            <h2><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h2>
            <p>Are you sure you want to delete this expense?</p>
            <p class="delete-item-name" id="deleteExpenseName"></p>
            <div class="modal-actions">
                <button class="cancel-btn" id="cancelDeleteExpenseBtn">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button class="delete-btn" id="confirmDeleteExpenseBtn">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Action completed</span>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="expenses.js"></script>
</body>
</html>
