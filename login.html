<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arabian Bismi Mandi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="images/ABM_logo.jpg" alt="Arabian Bismi Mandi Logo" class="login-logo-img">
                <h1>Arabian Bismi Mandi</h1>
                <p>Restaurant Billing System</p>
            </div>
            <form id="loginForm">
                <div class="login-form-group">
                    <label><i class="fas fa-phone"></i> Mobile Number</label>
                    <input type="tel" id="loginMobile" required placeholder="Enter your mobile number" maxlength="10" pattern="[0-9]{10}">
                </div>
                <div class="login-form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" required placeholder="Enter password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p class="login-error" id="loginError" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> <span id="loginErrorText">Invalid credentials</span>
                </p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
