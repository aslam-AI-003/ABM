<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arabian Bismi Mandi</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="images/ABM_logo.jpg" alt="Arabian Bismi Mandi Logo" class="login-logo-img">
                <h1 data-lang="loginTitle">Arabian Bismi Mandi</h1>
                <p data-lang="loginSubtitle">Restaurant Billing System</p>
            </div>

            <!-- Language Selector -->
            <div class="language-selector">
                <label><i class="fas fa-globe"></i> <span data-lang="selectLang">Select Language</span></label>
                <div class="lang-options">
                    <button type="button" class="lang-btn active" id="langEn" onclick="selectLanguage('en')">
                        <span class="lang-flag">EN</span> English
                    </button>
                    <button type="button" class="lang-btn" id="langTa" onclick="selectLanguage('ta')">
                        <span class="lang-flag">த</span> தமிழ்
                    </button>
                </div>
            </div>

            <form id="loginForm">
                <div class="login-form-group">
                    <label><i class="fas fa-phone"></i> <span data-lang="mobileLabel">Mobile Number</span></label>
                    <input type="tel" id="loginMobile" required data-lang-placeholder="mobilePlaceholder" placeholder="Enter your mobile number" maxlength="10" pattern="[0-9]{10}">
                </div>
                <div class="login-form-group">
                    <label><i class="fas fa-lock"></i> <span data-lang="passwordLabel">Password</span></label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" required data-lang-placeholder="passwordPlaceholder" placeholder="Enter password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> <span data-lang="loginBtn">Login</span>
                </button>
                <p class="login-error" id="loginError" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i> <span id="loginErrorText">Invalid credentials</span>
                </p>
            </form>
        </div>
    </div>

    <script src="lang.js"></script>
    <script src="auth.js"></script>
    <script>
        // Language selection on login page
        function selectLanguage(lang) {
            Lang.setLang(lang);
            
            // Update button states
            document.getElementById('langEn').classList.remove('active');
            document.getElementById('langTa').classList.remove('active');
            if (lang === 'en') {
                document.getElementById('langEn').classList.add('active');
            } else {
                document.getElementById('langTa').classList.add('active');
            }
            
            // Apply translations
            Lang.applyTranslations();
        }
        
        // On page load, set current language
        document.addEventListener('DOMContentLoaded', function() {
            const currentLang = Lang.getLang();
            if (currentLang === 'ta') {
                document.getElementById('langEn').classList.remove('active');
                document.getElementById('langTa').classList.add('active');
            }
            Lang.applyTranslations();
        });
    </script>
</body>
</html>
